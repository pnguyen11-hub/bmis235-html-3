<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="author" content="Phu Thanh Nguyen">
    <title>My Top 3 Vietnamese Dishes</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Menu: Each image links to one page. -->
    <nav aria-label="Main menu">
        <a href="index.html"><img src="img/home.png" alt="Home"></a>
        <a href="page1.html"><img src="img/page1.png" alt="Cơm Tấm"></a>
        <a href="page2.html"><img src="img/page2.png" alt="Phở"></a>
        <a href="page3.html"><img src="img/page3.png" alt="Bún Chả"></a>
    </nav>

    <main>
        <div class="showcase">

            <!-- HTML: Choose a dish to reveal a fun fact. -->
            <section class="dish-menu">
                <h2 class="menu-title">A taste of Vietnam</h2>
                <div class="menu-hint">Pick a dish to discover a fun fact.</div>

                <div class="dish-buttons" role="group" aria-label="Choose a dish">
                    <button type="button" aria-pressed="false"
                            aria-controls="dish-fact"
                            data-fact="Cơm tấm means broken rice. The small grains give this Saigon favorite its name.">
                        <span class="dish-icon" aria-hidden="true">🍚</span>
                        Cơm Tấm
                    </button>

                    <button type="button" aria-pressed="false"
                            aria-controls="dish-fact"
                            data-fact="That warm smell rising from a bowl of beef phở often comes from star anise and cinnamon in the broth.">
                        <span class="dish-icon" aria-hidden="true">🍜</span>
                        Phở
                    </button>

                    <button type="button" aria-pressed="false"
                            aria-controls="dish-fact"
                            data-fact="A bowl of bún chả often has two kinds of grilled pork. Look for small pork patties and thin slices of pork belly.">
                        <span class="dish-icon" aria-hidden="true">🥢</span>
                        Bún Chả
                    </button>
                </div>

                <div id="dish-fact" class="dish-fact" role="status"></div>
            </section>

            <!-- CSS: Style the menu card, dish buttons, and selected fact. -->
            <style>
                .showcase .dish-menu {
                    box-sizing: border-box;
                    width: 100%;
                    max-width: 580px;
                    max-height: 480px;
                    overflow: auto;
                    margin: 0 auto;
                    padding: 20px;
                    border: 1px solid #d8cbb6;
                    border-top: 6px solid #245442;
                    border-radius: 14px;
                    background: #fffaf0;
                    color: #302e26;
                    font-family: inherit;
                    text-align: left;
                }

                .showcase .menu-title {
                    margin: 0;
                    color: #245442;
                    font-size: 28px;
                }

                .showcase .menu-hint {
                    margin: 4px 0 16px;
                }

                .showcase .dish-buttons {
                    display: grid;
                    grid-template-columns: repeat(3, minmax(0, 1fr));
                    gap: 8px;
                }

                .showcase .dish-buttons button {
                    padding: 10px 4px;
                    border: 1px solid #245442;
                    border-radius: 10px;
                    background: #fffdf8;
                    color: #245442;
                    font: inherit;
                    font-weight: bold;
                    cursor: pointer;
                }

                .showcase .dish-icon {
                    display: block;
                    margin-bottom: 4px;
                    font-size: 28px;
                }

                .showcase .dish-buttons button:hover {
                    background: #e5eddf;
                }

                .showcase .dish-buttons button[aria-pressed="true"] {
                    background: #245442;
                    color: white;
                }

                .showcase .dish-buttons button:focus-visible {
                    outline: 3px solid #a43c29;
                    outline-offset: 2px;
                }

                .showcase .dish-fact:not(:empty) {
                    margin-top: 16px;
                    padding: 4px 0 4px 12px;
                    border-left: 3px solid #a43c29;
                    line-height: 1.5;
                }
            </style>

            <!-- JavaScript: Show the chosen fact and highlight its button. -->
            <script>
                const dishButtons = document.querySelectorAll(".showcase .dish-buttons button");
                const factBox = document.getElementById("dish-fact");

                for (const button of dishButtons) {
                    button.addEventListener("click", function () {
                        factBox.textContent = button.dataset.fact;

                        for (const item of dishButtons) {
                            item.setAttribute("aria-pressed", item === button);
                        }
                    });
                }
            </script>

        </div>
    </main>

    <footer>Built by Phu Thanh Nguyen &middot; BMIS 235</footer>

</body>
</html>
