
<!-- HTML: Three Vietnamese food buttons -->
<h2>My Top 3 Vietnamese Dishes</h2>
<p>Click a dish to discover a fun fact!</p>

<div class="food-buttons">
    <button onclick="showDish('comtam')">
        🍚 Com Tam
    </button>

    <button onclick="showDish('pho')">
        🍜 Pho
    </button>

    <button onclick="showDish('buncha')">
        🥢 Bun Cha
    </button>
</div>

<div class="food-info">
    <h3 id="food-name">Choose a dish!</h3>
    <p id="food-fact">
        Click one of the buttons above to learn more.
    </p>
</div>

<!-- CSS: Colors and design for the food graphic -->
<style>
.showcase {
    font-family: Arial, sans-serif;
    background-color: #8B2E1F;
    color: white;
    text-align: center;
    padding: 20px;
    border-radius: 12px;
}

.showcase .food-buttons button {
    background-color: #FFE6A7;
    color: black;
    border: none;
    padding: 15px;
    margin: 5px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
}

.showcase .food-buttons button:hover {
    background-color: #FFC857;
}

.showcase .food-info {
    background-color: white;
    color: black;
    padding: 15px;
    margin-top: 20px;
    border-radius: 8px;
}
</style>

<!-- JavaScript: Show a fun fact when a dish is clicked -->
<script>
function showDish(dish) {

    if (dish == "comtam") {
        document.getElementById("food-name").innerText =
            "Com Tam (Broken Rice)";
        document.getElementById("food-fact").innerText =
            "Fun fact: Com Tam is made from broken rice grains and is especially popular in Southern Vietnam!";
    }

    if (dish == "pho") {
        document.getElementById("food-name").innerText =
            "Pho (Vietnamese Noodle Soup)";
        document.getElementById("food-fact").innerText =
            "Fun fact: Pho broth is often cooked for hours to create its rich flavor!";
    }

    if (dish == "buncha") {
        document.getElementById("food-name").innerText =
            "Bun Cha (Grilled Pork with Noodles)";
        document.getElementById("food-fact").innerText =
            "Fun fact: Bun Cha comes from Hanoi and is famous for its grilled pork and dipping sauce!";
    }
}
</script>
